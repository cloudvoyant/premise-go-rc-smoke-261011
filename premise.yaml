workspace:
    name: premise-go-rc-smoke-261011
    kind: monorepo
    schema-version: "0.2"
    package_managers:
        - go
    providers:
        ci: github
        tools: mise
        tasks: mise
        infra: none
        versioning: svu
    projects:
        - name: greeting
          template: cloudvoyant/premise-go:premise-go-lib
          path: libs/greeting
          answers:
            module: github.com/cloudvoyant/premise-go-rc-smoke-261011/libs/greeting
            name: greeting
            publication: public
        - name: local
          template: cloudvoyant/premise-go:premise-go-lib
          path: libs/local
          answers:
            module: github.com/cloudvoyant/premise-go-rc-smoke-261011/libs/local
            name: local
            publication: private-local
        - name: message
          template: cloudvoyant/premise-go:premise-go-lib
          path: libs/message
          answers:
            module: github.com/cloudvoyant/premise-go-rc-smoke-261011/libs/message
            name: message
            publication: public
